#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "leafwiki"
name = "LeafWiki"
description.en = "Wiki with markdown stored on disk"
description.fr = "Wiki avec markdown stockés sur disque"

version = "0.13.0~ynh2"

maintainers = ["DeMiro5001"]

[upstream]
license = "MIT"
website = "https://leafwiki.com/"
demo = "https://demo.leafwiki.com/home"
code = "https://github.com/perber/leafwiki"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/leafwiki"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Admin password."
    help.fr = "Mot de passe admin."
    type = "password"

[resources]
    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract = false
    rename = "leafwiki"
    amd64.url = "https://github.com/perber/leafwiki/releases/download/v0.13.0/leafwiki-v0.13.0-linux-amd64"
    amd64.sha256 = "a7137fffa40a5ffd30cd0f319d071f3cd4c3d6e409e653d2e34768ab858036d1"
    arm64.url = "https://github.com/perber/leafwiki/releases/download/v0.13.0/leafwiki-v0.13.0-linux-arm64"
    arm64.sha256 = "ca190ee8b1f269da339aa6792b7503415a3ac344ac94630e21122049621b0648"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "leafwiki-v\\d+\\.\\d+\\.\\d+\\-linux-amd64"
    autoupdate.asset.arm64 = "leafwiki-v\\d+\\.\\d+\\.\\d+\\-linux-arm64"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
